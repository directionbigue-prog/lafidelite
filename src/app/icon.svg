<!--
  L'icône de l'onglet. Next sert automatiquement `app/icon.svg` comme favicon —
  aucun <link rel="icon"> à écrire, et aucun `icons` à déclarer dans metadata.

  Même marque que `public/logo.svg`, posée sur le fond encre #170D1B dans un
  carré arrondi. La version transparente serait invisible : l'onglet d'un
  navigateur en thème clair est blanc, et les cercles sont crème.

  Le `rx="14"` sur 64 est le rayon qu'attendent les systèmes qui n'appliquent
  pas leur propre masque ; ceux qui en appliquent un (iOS) recadrent par-dessus
  sans dommage, puisque la marque tient dans le cercle inscrit.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cœur Fidèle">
  <rect width="64" height="64" rx="14" fill="#170D1B" />
  <circle cx="24" cy="32" r="13" fill="none" stroke="#F6EEE6" stroke-width="3.2" />
  <circle cx="40" cy="32" r="13" fill="none" stroke="#F6EEE6" stroke-width="3.2" />
  <path d="M32 21.8A13 13 0 0 1 32 42.2A13 13 0 0 1 32 21.8Z" fill="#E8B860" />
</svg>
